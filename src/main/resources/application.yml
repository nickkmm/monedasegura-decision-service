spring:
  application:
    name: decision-service

server:
  port: 8080
  servlet:
    # Matches the server URL in monedasegura-infra/docs/api/decision-api.yaml
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
